user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Docker DNS must be resolved at request time because the backend is
        # recreated once after Quick Tunnel supplies its random public origin.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $collab_backend https://backend:8080;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location = /demo-healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/realtime {
            proxy_pass $collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;
            proxy_send_timeout 30s;
            proxy_ssl_server_name on;
            proxy_ssl_name backend;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
            proxy_ssl_verify on;
        }

        location /api/ {
            proxy_pass $collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_ssl_server_name on;
            proxy_ssl_name backend;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
            proxy_ssl_verify on;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
